<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniFoil</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 780px;
            margin: 48px auto;
            padding: 20px;
            background: #0f0f0f;
            color: #e0e0e0;
        }
        h1 {
            margin: 0 0 10px;
            color: #ffd700;
        }
        p {
            margin: 0 0 18px;
            color: #c9c9c9;
        }
        .links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .links a {
            color: #4da6ff;
            text-decoration: none;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 14px;
        }
        .links a:hover {
            border-color: #4da6ff;
        }
    </style>
</head>
<body>
    <h1>OmniFoil</h1>
    <p>Choose an endpoint:</p>
    <div class="links">
        <a href="/catalog">See catalog</a>
        <a href="/shop.json">shop.json</a>
        <a href="/shop.tfl">shop.tfl</a>
    </div>
</body>
</html>
